<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="一封信" />
    <meta name="theme-color" content="#f2eadc" />
    <title>给桂兰</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="is-closed">
    <main class="letter" id="letter" tabindex="-1"></main>

    <button class="cover" id="cover" type="button" aria-label="打开给桂兰的信">
      <span class="cover__grain" aria-hidden="true"></span>
      <span class="cover__inner">
        <span class="cover__name-wrap">
          <span class="cover__name" id="cover-name"></span>
          <span class="cover__seal" id="cover-seal" aria-hidden="true"></span>
        </span>
        <span class="cover__band" aria-hidden="true">缄</span>
        <span class="cover__hint" id="cover-hint"></span>
      </span>
    </button>

    <noscript>
      <style>
        body.is-closed {
          overflow: auto;
          height: auto;
        }
        .cover {
          display: none;
        }
      </style>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
