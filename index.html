<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="纪念我们结婚纪念日" />
    <meta name="theme-color" content="#ffc2d9" />
    <title>我们的爱 · SINCE 2020.01.13</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui">
        <p id="love-words"></p>
        <h1 id="timer-days"><span id="days-num">0</span><small>天</small></h1>
        <p id="timer-hms">
          <span id="hours-num">00</span><small>时</small>
          <span id="minutes-num">00</span><small>分</small>
          <span id="seconds-num">00</span><small>秒</small>
        </p>
        <p id="since">SINCE 2020.01.13</p>
      </div>
      <aside id="effects" aria-label="动画效果">
        <button type="button" class="effect-btn active" data-effect="heart">
          <span class="effect-icon" aria-hidden="true">♥</span>
          <span class="effect-label">爱心</span>
        </button>
        <button type="button" class="effect-btn" data-effect="name">
          <span class="effect-icon" aria-hidden="true">名</span>
          <span class="effect-label">名字</span>
        </button>
        <button type="button" class="effect-btn" data-effect="note">
          <span class="effect-icon" aria-hidden="true">♪</span>
          <span class="effect-label">音符</span>
        </button>
        <button type="button" class="effect-btn" data-effect="wave">
          <span class="effect-icon" aria-hidden="true">〜</span>
          <span class="effect-label">波浪</span>
        </button>
      </aside>
      <div id="hint">点击屏幕，再看一次</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
